[package]
name = "feed_handler"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
futures-util = "0.3"
kdbplus = { version = "0.3.9", features = ["ipc", "tokio"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
# Cambiamos esto para que use rustls, que es más fácil de compilar en WSL
tokio-tungstenite = { version = "0.20", features = ["rustls-tls-native-roots"] }